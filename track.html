<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Track Your Order — Reho Business</title>
<link rel="icon" href="icon-192.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800&family=DM+Mono:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:#0d1b2a;color:#0f172a;min-height:100vh;-webkit-font-smoothing:antialiased;}
.wrap{max-width:440px;margin:0 auto;padding:32px 20px 50px;}
.brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:28px;}
.brand-word{font-size:22px;font-weight:900;color:#fff;letter-spacing:.3px;}
.brand-word span{color:#e8a020;}
h1{font-size:20px;font-weight:800;color:#fff;text-align:center;margin-bottom:6px;}
.sub{font-size:13px;color:rgba(255,255,255,.55);text-align:center;margin-bottom:26px;line-height:1.6;}
.card{background:#fff;border-radius:16px;padding:22px 20px;box-shadow:0 16px 40px rgba(0,0,0,.25);}
.fl{display:block;font-size:11px;font-weight:700;color:#64748b;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px;}
.fi{width:100%;padding:13px 14px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:16px;font-family:'DM Mono',monospace;letter-spacing:2px;text-transform:uppercase;color:#0f172a;text-align:center;}
.fi:focus{outline:none;border-color:#1a3a8f;box-shadow:0 0 0 3px rgba(26,58,143,.12);}
.btn{width:100%;padding:14px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;border:none;margin-top:14px;background:#1a3a8f;color:#fff;font-family:inherit;transition:background .15s,transform .12s;}
.btn:hover{background:#2d52b8;}
.btn:active{transform:scale(.98);}
.btn:disabled{opacity:.6;cursor:default;}
.err{display:none;background:#fee2e2;color:#b91c1c;border-radius:8px;padding:10px 12px;font-size:12.5px;margin-top:12px;text-align:center;}
.result{display:none;margin-top:22px;}
.result.show,.err.show{display:block;}
.res-head{text-align:center;margin-bottom:20px;}
.res-name{font-size:16px;font-weight:800;color:#0f172a;}
.res-code{font-size:11px;font-family:'DM Mono',monospace;color:#94a3b8;margin-top:2px;}
.steps{display:flex;flex-direction:column;gap:0;margin-bottom:20px;}
.step{display:flex;gap:12px;position:relative;padding-bottom:22px;}
.step:last-child{padding-bottom:0;}
.step::before{content:'';position:absolute;left:13px;top:28px;bottom:0;width:2px;background:#e2e8f0;}
.step:last-child::before{display:none;}
.step.done::before{background:#1a6b3c;}
.dot{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;background:#f1f5f9;color:#94a3b8;z-index:1;}
.step.done .dot{background:#1a6b3c;color:#fff;}
.step.active .dot{background:#e8a020;color:#fff;}
.step-body{padding-top:3px;}
.step-title{font-size:13.5px;font-weight:700;color:#0f172a;}
.step-title.muted{color:#94a3b8;}
.step-desc{font-size:12px;color:#64748b;margin-top:2px;line-height:1.5;}
.support{text-align:center;font-size:12px;color:#94a3b8;margin-top:8px;}
.support strong{color:#64748b;}
.back{display:block;text-align:center;font-size:12px;color:rgba(255,255,255,.4);margin-top:22px;text-decoration:none;}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="brand-word">Reho<span>Business</span></div>
  </div>
  <h1>Track Your Order</h1>
  <div class="sub">Enter the tracking code from your order confirmation to see your site's build status.</div>

  <div class="card">
    <label class="fl">Tracking Code</label>
    <input class="fi" id="code" placeholder="RB-XXXXXX" maxlength="12" autocomplete="off">
    <button class="btn" id="btn" onclick="track()">Track My Order →</button>
    <div class="err" id="err"></div>

    <div class="result" id="result">
      <div class="res-head">
        <div class="res-name" id="resName"></div>
        <div class="res-code" id="resCode"></div>
      </div>
      <div class="steps" id="steps"></div>
      <div class="support">Questions? WhatsApp us on <strong>09037066499</strong></div>
    </div>
  </div>

  <a href="index.html" class="back">← Back to RehoBusiness</a>
</div>

<script>
const FB={
  projectId:'rehovtu-b5f1a',
  apiKey:'AIzaSyCCy_D8KDnLAo77ULYvPDDt79uBwCEGRUY',
  baseUrl(){return `https://firestore.googleapis.com/v1/projects/${this.projectId}/databases/(default)/documents/rv2`;},
  async get(col){
    try{
      const r=await fetch(`${this.baseUrl()}/${col}?key=${this.apiKey}`);
      const d=await r.json();
      if(d.fields){
        const raw=d.fields.data?.stringValue;
        return raw?JSON.parse(raw):null;
      }
      return null;
    }catch{return null;}
  }
};

function el(id){return document.getElementById(id);}

function buildSteps(order){
  const paid = order.paymentConfirmed || order.paymentVerified || order.status==='Building' || order.status==='Done';
  const building = order.status==='Building' || order.status==='Done';
  const done = order.status==='Done';

  const steps=[
    {
      title:'Order Received',
      desc:'We have your order details.',
      state:'done'
    },
    {
      title: paid ? 'Payment Confirmed' : 'Awaiting Payment Confirmation',
      desc: paid ? 'Your payment has been verified.' : (order.paymentMethod==='flutterwave' ? 'Verifying your Flutterwave payment.' : 'We are verifying your bank transfer — usually within a few hours.'),
      state: paid ? 'done' : 'active'
    },
    {
      title: building ? (done ? 'Site Built' : 'Building Your Site') : 'Site Build',
      desc: done ? 'Your VTU site was built and configured.' : (building ? 'Your site is being built — usually within 48 hours.' : 'Starts once payment is confirmed.'),
      state: done ? 'done' : (building ? 'active' : 'pending')
    },
    {
      title: done ? 'Live — Login Details Sent' : 'Delivery',
      desc: done ? 'Check your email and WhatsApp for login details.' : 'Login details are sent by email and WhatsApp once your site is live.',
      state: done ? 'done' : 'pending'
    }
  ];
  return steps;
}

function renderSteps(steps){
  el('steps').innerHTML = steps.map(s=>{
    const cls = s.state==='done' ? 'step done' : (s.state==='active' ? 'step active' : 'step');
    const icon = s.state==='done' ? '✓' : (s.state==='active' ? '●' : '');
    const titleCls = s.state==='pending' ? 'step-title muted' : 'step-title';
    return `<div class="${cls}">
      <div class="dot">${icon}</div>
      <div class="step-body">
        <div class="${titleCls}">${s.title}</div>
        <div class="step-desc">${s.desc}</div>
      </div>
    </div>`;
  }).join('');
}

async function track(){
  const codeRaw = el('code').value.trim().toUpperCase();
  const errEl = el('err'), resultEl = el('result'), btn = el('btn');
  errEl.classList.remove('show');
  resultEl.classList.remove('show');

  if(!codeRaw){
    errEl.textContent = 'Please enter your tracking code.';
    errEl.classList.add('show');
    return;
  }
  const code = codeRaw.startsWith('RB-') ? codeRaw : 'RB-'+codeRaw.replace(/^RB-?/,'');

  btn.disabled = true;
  btn.textContent = 'Searching…';

  try{
    const orders = await FB.get('orders') || [];
    const order = orders.find(o => (o.trackingCode||'').toUpperCase() === code);

    if(!order){
      errEl.textContent = "We couldn't find an order with that tracking code. Please check and try again, or WhatsApp us on 09037066499.";
      errEl.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Track My Order →';
      return;
    }

    el('resName').textContent = order.sitename || order.name || 'Your Order';
    el('resCode').textContent = order.trackingCode;
    renderSteps(buildSteps(order));
    resultEl.classList.add('show');
  }catch(e){
    errEl.textContent = 'Something went wrong. Please try again in a moment.';
    errEl.classList.add('show');
  }
  btn.disabled = false;
  btn.textContent = 'Track My Order →';
}

el('code').addEventListener('keydown', e => { if(e.key==='Enter') track(); });
</script>
</body>
</html>
